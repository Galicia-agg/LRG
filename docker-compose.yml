name: aceitera-taller-prod

services:
  app_aceitera:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: aceitera-taller-php:1.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - aceitera-public:/var/www/html/public
      - aceitera-storage:/var/www/html/storage/app/public
    depends_on:
      postgres_aceitera:
        condition: service_healthy
    networks:
      - aceitera

  webserver_aceitera:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:80"
    volumes:
      - aceitera-public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app_aceitera
    networks:
      - aceitera

  postgres_aceitera:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aceitera}
      POSTGRES_USER: ${DB_USERNAME:-aceitera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5435:5432"
    volumes:
      - aceitera-pgsql:/var/lib/postgresql
    networks:
      - aceitera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aceitera} -d ${DB_DATABASE:-aceitera}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  aceitera:
    driver: bridge

volumes:
  aceitera-pgsql:
    driver: local
  aceitera-public:
    driver: local
  aceitera-storage:
    driver: local
